[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconlab-assignment"
version = "0.1.0"
description = "Composable multi-view reconstruction and experiment framework"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.8,<5", "h5py>=3.9,<4"]

[project.scripts]
reconlab = "reconlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.setuptools.package-data]
reconlab = ["defaults/*.json"]
